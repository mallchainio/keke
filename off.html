<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宵禁时间</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 18px;
            padding: 45px 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 54px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 15px;
        }

        .desc {
            font-size: 15px;
            color: #888;
            line-height: 1.8;
        }

        .time {
            margin-top: 25px;
            padding: 14px;
            border-radius: 12px;
            background: #f5f7fa;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">🔒</div>

    <div class="title">
        当前时间禁止观看
    </div>

    <div class="desc">
        请耐心等待，稍后再来
    </div>

    <div class="time">
        紫可可 zikeke.app
    </div>
</div>

</body>
</html>
