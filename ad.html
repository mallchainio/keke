
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广告位出租</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            min-height: 280px;
            background: #fff;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 58px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #222;
            margin-bottom: 12px;
        }

        .desc {
            font-size: 15px;
            color: #888;
            line-height: 1.8;
        }

        .contact {
            margin-top: 25px;
            padding: 10px 20px;
            border-radius: 20px;
            background: #f1f3f5;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">📢</div>

    <div class="title">
        这是一个广告
    </div>

    <div class="desc">
        广告位出租<br>
        欢迎品牌、网站及项目合作
    </div>

    <div class="contact">
        紫可可 www.zikeke.app
    </div>
</div>

</body>
</html>
