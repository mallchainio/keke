.lock-link:hover {

.lock-link .lock-title {
    font-weight: bold;
}

.lock-link .lock-url {
    font-size: 12px;
    color: #a66aff;
    word-break: break-all;

.footer {
    text-align: center;
    color: #555;
    font-size: 12px;
    padding: 30px 10px;

@media (max-width: 600px) {

    .main {
